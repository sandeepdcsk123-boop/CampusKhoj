  </defs>
  <g transform="translate(28 30)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 48 V12 H48 M78 12 H114 V48 M114 78 V114 H78 M48 114 H12 V78" stroke="#101D38" stroke-width="10"/>
    <circle cx="63" cy="63" r="25" fill="url(#gold)" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="63" cy="63" r="34" stroke="#101D38" stroke-width="2" opacity=".16"/>
  </g>
